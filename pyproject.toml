# Configuration des outils Python (pas de paquet publié).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# La longueur des lignes est gérée par black (qui ne coupe pas les chaînes).
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
