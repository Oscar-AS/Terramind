# Règles de pull request : titre Conventional Commits, description et « Tâche liée » renseignées.
# Pose les étiquettes par chemin et de taille ; prévient (sans bloquer) si la PR dépasse 400 lignes
# ou si docs/api.md change sans l'approbation d'un CODEOWNER.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  title-and-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Titre au format Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|test|chore|content|ml)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::Titre de PR invalide : « $TITLE ». Format attendu : « type: description », avec type parmi feat, fix, docs, test, chore, content, ml. Exemple : « feat: ajoute le webhook WhatsApp »."
            exit 1
          fi
          echo "Titre conforme."
      - name: Description et « Tâche liée » renseignées
        uses: actions/github-script@v9
        with:
          script: |
            const body = (context.payload.pull_request.body || "").replace(/<!--[\s\S]*?-->/g, "");
            if (!body.trim()) {
              core.setFailed("La description de la PR est vide : remplis le modèle de PR.");
              return;
            }
            const lines = body.split(/\r?\n/);
            const index = lines.findIndex((l) => /t[âa]che li[ée]e/i.test(l));
            let task = "";
            if (index >= 0) {
              task = lines[index].replace(/^[#\s*-]*t[âa]che li[ée]e\s*:?/i, "").trim();
              for (const line of lines.slice(index + 1)) {
                if (task || /^#{1,6}\s/.test(line)) break;
                task = line.trim();
              }
            }
            if (!task) {
              core.setFailed("La ligne « Tâche liée » est absente ou vide : indique la tâche de docs/TACHES.md ou l'issue (Closes #…).");
            }

  labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Étiquettes par chemin
        uses: actions/labeler@v7
      - name: Étiquette de taille et avertissement au-delà de 400 lignes
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = pr.additions + pr.deletions;
            const size = changed <= 100 ? "taille:petite" : changed <= 400 ? "taille:moyenne" : "taille:grande";
            const issue = { ...context.repo, issue_number: pr.number };
            const current = (await github.rest.issues.listLabelsOnIssue(issue)).data.map((l) => l.name);
            for (const name of current) {
              if (name.startsWith("taille:") && name !== size) await github.rest.issues.removeLabel({ ...issue, name });
            }
            if (!current.includes(size)) await github.rest.issues.addLabels({ ...issue, labels: [size] });
            if (changed <= 400) return;
            const marker = "<!-- pr-size-warning -->";
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            if (comments.some((c) => c.body.includes(marker))) return;
            await github.rest.issues.createComment({
              ...issue,
              body: `${marker}\n⚠️ PR trop grande, découpe-la (${changed} lignes modifiées, limite conseillée : 400).`,
            });

  api-contract-owners:
    runs-on: ubuntu-latest
    steps:
      - name: Avertir si docs/api.md change sans approbation d'un CODEOWNER
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number });
            if (!files.some((f) => f.filename === "docs/api.md")) return;

            const { data } = await github.rest.repos.getContent({ ...context.repo, path: ".github/CODEOWNERS", ref: pr.base.ref });
            const rules = Buffer.from(data.content, "base64").toString("utf8")
              .split(/\r?\n/).map((l) => l.trim()).filter((l) => l && !l.startsWith("#"));
            const rule = rules.reverse().find((l) => /^\/?docs\/api\.md\s/.test(l));
            const author = pr.user.login.toLowerCase();
            const owners = rule ? rule.split(/\s+/).slice(1).map((o) => o.replace(/^@/, "").toLowerCase()) : [];

            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...context.repo, pull_number: pr.number });
            const latest = {};
            for (const r of reviews) if (r.state !== "COMMENTED") latest[r.user.login.toLowerCase()] = r.state;
            const approved = owners.some((o) => o !== author && latest[o] === "APPROVED");
            if (approved) return;

            const issue = { ...context.repo, issue_number: pr.number };
            const marker = "<!-- api-contract-warning -->";
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            if (comments.some((c) => c.body.includes(marker))) return;
            const who = owners.length ? owners.map((o) => "@" + o).join(", ") : "les CODEOWNERS";
            await github.rest.issues.createComment({
              ...issue,
              body: `${marker}\n⚠️ Cette PR modifie le contrat d'API (docs/api.md). Elle doit être approuvée par ${who} (hors auteur) avant fusion.`,
            });
